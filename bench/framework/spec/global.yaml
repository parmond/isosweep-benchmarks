# isosweep benchmark framework — GLOBAL POLICY (applies to every benchmark).
#
# This file is the single definition of how a benchmark is performed. The
# harness (bench/framework/run.py) is driven by it, the conformance audit
# (audit/conformance.py) checks every run against it, and the methodology audit
# (audit/METHODOLOGY_CHECKLIST.md) checks it against industry practice.
# Changing anything here changes the spec hash and invalidates prior results.
schema: isosweep-bench/1
policy_version: "2026-11-20"

timed_region:
  definition: >-
    Contouring computation only, one call per timed interval. Input: the grid
    already in memory as a C-contiguous array in each tool's own native input
    dtype (float32 for isosweep; float64 for ContourPy, VTK, GDAL, contour-rs,
    scikit-image; float32 volumes in 3D), converted untimed in prepare() from
    the float64 source field — no tool pays for a conversion another does not.
    Precision differences this leaves are measured per tool (W3 vertex
    accuracy) and disclosed. Output: the API's own native in-memory result
    (NumPy arrays, Python result objects, C arrays handed to a callback, or the
    in-memory layer an API requires). Releasing the previous result, clearing
    an output layer and garbage collection happen outside the timed interval
    for every tool.
  prepare_may: [read input files, generate synthetic fields, convert input to the tool's native dtype,
                zero-copy wrap input, construct pipeline objects, compute levels, start worker processes,
                reset or release the previous result]
  prepare_disclosure: >-
    Setup moved out of the timed interval that is not O(1) is a variant that
    favours that tool, published only as such (ContourPy reused generator).
  forbidden_in_timed_region: [file_io, process_spawn, network, plotting_or_rendering_objects, serialization_to_formats]
  enforcement:
    static: >-
      Python adapters: every call in compute() must match the tool's
      compute_allowlist and no call may match static_denylist. Native workers:
      the same, applied to the source between BEGIN_TIMED and END_TIMED.
    dynamic: >-
      Linux: each measured (benchmark, configuration) is executed once under
      strace -f with ISOBENCH_ markers around one compute(); any forbidden
      syscall between the markers fails the run.

static_denylist:   # fnmatch patterns on dotted call names (Python) / identifiers (C, Rust)
  python: ["open", "print", "input", "exec", "eval", "os.*", "subprocess.*", "shutil.*", "socket.*",
           "pathlib.*", "time.sleep", "*.read", "*.readline", "*.readlines", "*.write", "*.writelines",
           "*.tofile", "*.fromfile", "np.load", "np.save*", "np.fromfile", "numpy.load", "numpy.save*",
           "*.savefig", "plt.*", "matplotlib.*", "*.contourf", "*.imshow", "gc.*"]
  native: ["fopen", "fread", "fwrite", "fprintf", "printf", "puts", "fputs", "open", "read", "write",
           "system", "popen", "fork", "vfork", "execv", "execvp", "execve", "socket", "connect",
           "usleep", "sleep", "nanosleep", "GDALOpen", "GDALCreate", "OGROpen",
           "File::open", "File::create", "std::fs::*", "std::process::*", "println", "print", "eprintln"]

syscall_audit:                    # R6: allowlist model — inside the window, anything not listed is a violation
  tool: "strace -f -y -qq"        # every syscall of every thread / child process
  marker: {fd: 2, begin: "ISOBENCH_T0", end: "ISOBENCH_T1"}
  allowed_syscalls: [                # memory, threads + synchronisation, time, signals, process identity
    brk, mmap, munmap, mremap, madvise, mprotect, membarrier,
    futex, futex_waitv, sched_yield, sched_getaffinity, sched_setaffinity, sched_getparam,
    sched_getscheduler, set_robust_list, get_robust_list, rseq, set_tid_address, gettid, getpid,
    getppid, getuid, geteuid, getgid, getegid, exit, prctl, arch_prctl, getcpu, prlimit64, getrlimit,
    rt_sigprocmask, rt_sigaction, rt_sigreturn, sigaltstack, tgkill,
    clock_gettime, clock_getres, clock_nanosleep, nanosleep, gettimeofday, getrusage, getrandom,
    uname, sysinfo, eventfd2, epoll_create1, epoll_ctl, epoll_wait, epoll_pwait, epoll_pwait2,
    poll, ppoll, pipe2]
  thread_syscalls: [clone, clone3]   # allowed only with clone_requires_flag (a thread, not a process)
  clone_requires_flag: CLONE_THREAD
  mmap_file_backed_forbidden: true   # mmap with a file descriptor = file I/O by page faults
  fd_syscalls: [read, write, pread64, pwrite64, readv, writev, preadv, pwritev, preadv2, pwritev2, lseek,
                close, fstat, newfstatat, ioctl, dup, dup2, dup3, fcntl]
  allowed_fd_kinds: [pipe, anon_inode]   # thread wake-ups, worker reply channels
  # P1: read-only CPU-topology reads some libraries make in compute (e.g. ContourPy threaded:
  # /sys/devices/system/cpu/online). Allowed only O_RDONLY, recorded per configuration, disclosed.
  path_open_syscalls: [open, openat, openat2]
  allowed_read_paths: [/sys/devices/system/cpu/online, /sys/devices/system/cpu/possible,
                       /sys/devices/system/cpu/present, /sys/fs/cgroup/cpu.max, /proc/self/status,
                       /proc/self/stat]
  required_on: [reference, preflight]
  keep_logs: true                    # every log kept (gzip) and re-analysed by the auditor (C07)

stats:
  warmup_runs: 1
  rounds: 30                      # timed samples per configuration: fixed, no optional stopping (R9)
  order: randomized_interleaved   # each round runs every configuration once, in a fresh random order
  rng_seed: 20261119
  min_sample_ms: 100              # pyperf-style loop calibration: a sample repeats compute() until >= this
  max_loops: 1000
  per_call_timing: true           # each call timed on its own; result release outside the clock
  gc_disabled_in_sample: true     # Python's cyclic GC off inside a sample (as timeit), collected before it
  record_cpu_time: true           # process CPU time per call (all threads): W4
  max_major_faults: 0             # page-fault I/O inside a sample is file I/O (R6)
  summary: median
  report: [median, min, max, q1, q3, cv, n, loops]
  max_cv: 0.05                    # coefficient of variation per configuration: above it, the variation is
                                  # disclosed with the result (attestation C09 'variability', site, dashboard)
  cv_gate_on: []                  # 2026-11-22: variation is recorded and disclosed, not a failure: a tool
                                  # whose time varies run to run has that as a property (no run is discarded)
  discard_outliers: false         # every sample is kept and reported
  ratio_ci: {method: hodges_lehmann_log_ratio, level: 0.95}
  claim_requires_ci_above: 1.0    # a "faster" claim needs the CI lower bound of the ratio > 1

sweeps:                           # selecting each multi-threaded configuration's best setting
  repeats: 2
  thread_candidates: [1, 2, 4, 8, 16, 32, 48, 64, 96, 128, 192]   # capped at logical CPUs
  record_all_candidates: true
  applies_to_ours_and_competitors_equally: true

validation_defaults:              # like-for-like output checks (consensus = median over unwaived tools)
  bands2d:                        # filled bands: leave-one-out consensus per band (+ exact total area)
    output_class: polygons.bands
    total_area_rel_tol: 1.0e-7    # B1: bands partition the domain: total area == (nx-1)(ny-1) (exact oracle)
    band_area_rel_tol: 1.0e-4     # B1 every band: max(rel * reference, abs) + the saddle area budget
    band_area_abs: 1.0            # cells^2 (float32 coordinates along a long boundary)
    band_points_rel_tol: 0.01     # B1 distinct interior vertices per band
    band_points_abs: 2
    band_polygons_rel_tol: 0.02   # B2 polygons per band (+ one per saddle cell of its two levels)
    accuracy_cells: {float64: 1.0e-5, float32: 2.0e-3}
  contour2d:                      # leave-one-out consensus over independent families (R4/W1-W3)
    output_class: polylines.assembled
    length_rel_tol: 0.005         # W1 total length
    points_rel_tol: 0.01          # W1 total vertices (canonical: no duplicate / repeated closing vertex)
    level_length_rel_tol: 0.005   # W1 every level: max(rel * reference, abs) ...
    level_length_abs: 2.0         # ... in grid cells (one saddle cell joined the other way moves < 2 cells)
    level_points_rel_tol: 0.01
    level_points_abs: 2
    feature_count_rel_tol: 0.05   # W2: more lines than the reference = less joining (direction-labelled)
    accuracy_cells: {float64: 1.0e-5, float32: 2.0e-3}   # W3: max distance (cells) along the cell edge
                                                         # from a vertex to the exact crossing
                                                         # (float32: ulp of the coordinate, e.g. 1.2e-4 at 1440)
  surface3d:
    output_class: mesh.triangles
    triangle_count_rel_tol: 0.02

process_env:     # R7: the harness runs under `env -i` with only these (cloud/run_node.sh);
                 # anything else (thread-count, allocator, preload, library-tuning variables)
                 # fails C02 on reference/preflight. Names of all variables are recorded.
  allow: [HOME, PATH, LANG, LC_ALL, LC_CTYPE, TIF2F64, PWD, SHLVL, _]
environments:
  reference:
    publishable: true
    instance_types: [c7i.metal-24xl, c7g.metal]
    require:
      bare_metal: true            # no 'hypervisor' CPU flag AND a .metal instance type
      turbo_disabled: true
      governor: performance
      thp: never
      aslr: 0
      max_load_avg_1m: 2.0
      strace: true
      process_env_clean: true     # R7: only process_env.allow variables set (no OMP_*, VTK_*, LD_PRELOAD …)
  preflight:
    publishable: false
    instance_types: [c7i.xlarge, c7g.xlarge]
    require: {strace: true, process_env_clean: true}
    purpose: >-
      Build every artifact on the target OS image and run one smoke case per
      tool with full validation, before any bare-metal run. Any change to the
      source tree or spec after a preflight invalidates it (hash-checked).
  indicative:
    publishable: false
    require: {}

publication:
  require_attestation_pass: true
  require_environment: reference
  require_preflight_pass_same_source_and_spec: true
  require_auditor_selftest_pass: true
  require_spec_hash_match: true
  require_single_run: true        # every number on a page comes from one run (one machine)
  require_source_snapshot_or_clean_git: true

excluded_from_comparisons:
  - tool: "scikit-image marching_cubes"
    reason: "always computes vertex normals (no option to disable): extra work that favours isosweep; differences favouring isosweep are fixed or excluded, never waived."
  - tool: matplotlib
    reason: "contour() adds plotting-object construction on top of its engine; its engine, ContourPy, is benchmarked directly."
  - tool: d3-contour
    reason: "returns filled >=level polygons, not isolines (different output class)."
  - tool: polygon/filled modes
    reason: "competitors build band polygons; isosweep returns classified rings (different output class)."
  - tool: "file-to-file CLIs (gdal_contour, isosweep-contour)"
    reason: "include process start-up and file I/O; kept as internal CLI QA, never published."
  - tool: "commercial tools (MATLAB, ArcGIS Pro, Global Mapper, FME, Surfer, Tecplot, EDA suites)"
    reason: "licence terms restrict benchmarking or publication (MathWorks SLA §3.4 verified); evaluate side by side under NDA."

preflight_only_benchmarks: [vol-sphere-64]   # tiny integration case, never published
profiles:
  reference: {benchmarks: all}     # all = every benchmark except preflight_only_benchmarks; no subsets (R5)
  preflight:
    benchmarks: [medical-rt-isodose, dem-tile-512, dem-tile-512-bands, vol-sphere-64]
    rounds: 3
    run_auditor_selftest_live: true
  indicative: {benchmarks: all, rounds: 5}

reuse:   # R13: each configuration is measured once per code, data, method and machine (isobench/store.py);
         # later runs take it from the result store while its key is unchanged (C17 recomputes every key)
  anchor_benchmarks:  # re-measured completely (every configuration, interleaved as when stored, each in
                      # its stored configuration) in every run that reuses anything
    - medical-rt-isodose
    - dem-tile-512
    - gfs-mslp
  max_drift: 0.03     # |median over all anchor configurations of (median / stored median - 1)|: a machine
                      # unlike the store's shifts them all; one tool's own variation is recorded, not a stop
